<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cinematic</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">cinematic</div>
      <button type="button" id="btn-open" class="btn">Open</button>
      <span id="file-label" class="file-label">no video</span>
      <span id="encoder" class="muted"></span>
      <div class="top-actions">
        <button type="button" id="btn-save" class="btn" disabled>Save</button>
        <button type="button" id="btn-export" class="btn primary" disabled>Export</button>
      </div>
    </header>

    <div class="layout">
      <section class="stage" id="stage">
        <div class="empty" id="empty">
          <p>Open a recording, add zoom points, export with ffmpeg.</p>
          <button type="button" id="btn-open-2" class="btn primary">Open video</button>
        </div>
        <div class="viewport hidden" id="viewport">
          <video id="video" playsinline></video>
          <div id="rect" class="rect hidden">
            <div class="handle nw" data-handle="nw"></div>
            <div class="handle ne" data-handle="ne"></div>
            <div class="handle sw" data-handle="sw"></div>
            <div class="handle se" data-handle="se"></div>
          </div>
        </div>
      </section>

      <aside class="side">
        <div class="side-head">
          <span>Zooms</span>
          <button type="button" id="btn-add" class="btn" disabled>Add at playhead</button>
        </div>
        <ul id="zoom-list" class="zoom-list"></ul>
        <div class="side-head">
          <span>Speed</span>
          <button type="button" id="btn-add-speed" class="btn" disabled>Add 2× block</button>
        </div>
        <ul id="speed-list" class="zoom-list speed-list"></ul>
        <div id="inspector" class="inspector hidden">
          <label>Transition
            <input id="in-dur" type="number" min="0.05" max="4" step="0.05">
            <span>s</span>
          </label>
          <label>Hold
            <input id="hold-dur" type="number" min="0.1" max="120" step="0.1">
            <span>s</span>
          </label>
          <label>Zoom out
            <input id="out-dur" type="number" min="0.05" max="4" step="0.05">
            <span>s</span>
          </label>
          <label>Easing
            <select id="easing">
              <option value="easeInOutCubic">ease in-out</option>
              <option value="easeOutCubic">ease out</option>
              <option value="easeInCubic">ease in</option>
              <option value="linear">linear</option>
            </select>
          </label>
          <button type="button" id="btn-delete" class="btn danger">Delete zoom</button>
        </div>
        <div id="speed-inspector" class="inspector hidden">
          <label>Start
            <input id="sp-start" type="number" min="0" step="0.05">
            <span>s</span>
          </label>
          <label>End
            <input id="sp-end" type="number" min="0" step="0.05">
            <span>s</span>
          </label>
          <label>Factor
            <input id="sp-factor" type="number" min="0.25" max="4" step="0.25">
            <span>×</span>
          </label>
          <button type="button" id="btn-delete-speed" class="btn danger">Delete block</button>
        </div>
      </aside>

      <section class="transport">
        <div class="transport-row">
          <button type="button" id="btn-play" class="btn" disabled>Play</button>
          <span id="clock" class="clock">0:00.00</span>
          <span class="muted" id="clock-dur">/ 0:00.00</span>
          <span class="spacer"></span>
          <span class="hint">n add zoom · f add 2× block · zoom points pan automatically · space play</span>
        </div>
        <div class="timeline" id="timeline">
          <div class="tl-lane">
            <span class="tl-lane-label">zoom</span>
            <div class="tl-track" id="tl-track">
              <div id="tl-regions"></div>
              <div id="playhead" class="playhead"></div>
            </div>
          </div>
          <div class="tl-lane">
            <span class="tl-lane-label">speed</span>
            <div class="tl-track compact" id="speed-track" title="Blocks where playback runs faster">
              <div id="speed-keys"></div>
              <div id="playhead-speed" class="playhead"></div>
            </div>
          </div>
          <div class="tl-lane">
            <span class="tl-lane-label">crop</span>
            <div class="tl-track compact" id="crop-track" title="Drag the handles to set export start and end">
              <div id="crop-keys"></div>
              <div id="playhead-crop" class="playhead"></div>
            </div>
          </div>
          <div class="tl-labels-row">
            <span class="tl-lane-label"></span>
            <div class="tl-labels" id="tl-labels"></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <dialog id="dlg-open">
    <div class="dlg-head">
      <strong>Open video</strong>
      <button type="button" class="btn" data-close>Close</button>
    </div>
    <div class="fs-path">
      <button type="button" id="fs-up" class="btn">Up</button>
      <input id="fs-path" type="text" spellcheck="false">
      <button type="button" id="fs-go" class="btn">Go</button>
    </div>
    <ul id="fs-list" class="fs-list"></ul>
  </dialog>

  <dialog id="dlg-export">
    <div class="dlg-head">
      <strong>Export</strong>
      <button type="button" class="btn" data-close>Close</button>
    </div>
    <label class="full">Quality
      <select id="export-preset">
        <option value="default">Default — fast, hardware if available</option>
        <option value="smooth">Smooth — motion first, big files</option>
        <option value="quality">Quality — detail first, big files</option>
        <option value="small">Small — compact, 1600×1000</option>
        <option value="tiny">Tiny — smallest, 1280×800</option>
      </select>
    </label>
    <label class="full">Output
      <input id="export-path" type="text" spellcheck="false">
    </label>
    <div class="progress-wrap">
      <div id="progress-bar"></div>
    </div>
    <div id="export-status" class="muted">Ready</div>
    <pre id="export-log"></pre>
    <div class="dlg-actions">
      <button type="button" id="btn-run-export" class="btn primary">Start export</button>
    </div>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
